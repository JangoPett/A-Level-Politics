    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.875rem; transition: background 0.2s, border-color 0.2s; }
    button:hover, select:hover { border-color: var(--accent); }
    
    .overall-progress { background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-bottom: 24px; }
    .progress-bar-bg { background: var(--border); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.4s ease; }
    
    .paper-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .paper-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    
    .topic-card { border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-top: 10px; background: rgba(0,0,0,0.05); }
    .topic-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .topic-name { font-weight: 600; flex-grow: 1; }
    .status-select { font-weight: 600; padding: 4px 8px; }
    .status-0 { color: var(--status-0); }
    .status-1 { color: var(--status-1); }
    .status-2 { color: var(--status-2); }
    .status-3 { color: var(--status-3); }

    .drawer-toggle { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; text-decoration: underline; padding: 4px 0; margin-top: 6px; display: inline-block; }
    .drawer-content { display: none; margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
    .drawer-content.open { display: block; }
    
    .section-subtitle { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; margin-top: 10px; }
    .spec-list { list-style: disc; margin-left: 20px; font-size: 0.85rem; color: var(--text-muted); }
    .spec-list li { margin-bottom: 4px; }
    .thinker-tag { display: inline-block; background: var(--border); padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; margin: 2px 4px 2px 0; }
    
    .question-item { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin-top: 6px; font-size: 0.875rem; }
    .question-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }

                  id: "p3b_t6",

                  bullets: ["Main ideas of realism, Main ideas of liberalism, Divisions between realism and liberalism, Main ideas of the anarchical society and society of states theory, extent to which realism and liberalism explain recent developments (since 2000) in global politics"],
                  thinkers: [],
                  questions: []
                 }
              ]
            }
          ]
        }
      ]
    };

    // --- 2. APP STATE MANAGEMENT ---
    let appState = {
      p3Route: "3a",
      nonCore: "feminism",
      theme: "dark",
      statuses: {},
      questionStatuses: {}
    };

    function loadState() {
      const saved = localStorage.getItem("politics_tracker_state");
      if (saved) {
        appState = { ...appState, ...JSON.parse(saved) };
      }
      document.body.classList.toggle("light-mode", appState.theme === "light");
      document.getElementById("p3RouteSelect").value = appState.p3Route;
      document.getElementById("nonCoreSelect").value = appState.nonCore;
    }

    function saveState() {
      localStorage.setItem("politics_tracker_state", JSON.stringify(appState));
      updateProgress();
    }

    // --- 3. CSV UTILITY & COMPREHENSIVE MODULE MAPPING ---
    function parseCSVLine(text) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          if (inQuotes && text[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          result.push(cur.trim());
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur.trim());
      return result;
    }

    function importQuestionsFromCSV(csvText) {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length < 2) return 0;

      let addedCount = 0;
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (cols.length < 4) continue;

        const year = cols[0];
        const paperStr = cols[1] || '';
        const type = cols[2];
        const prompt = cols[3];
        const mainModule = cols[4] || '';

        if (!prompt) continue;

        let matchedTopicId = null;
        const modLower = mainModule.toLowerCase();
        const paperLower = paperStr.toLowerCase();

        // Paper 3A (US Politics) Mapping
        if (modLower.includes('congress')) matchedTopicId = 'p3a_t2';
        else if (modLower.includes('potus') || modLower.includes('presidency')) matchedTopicId = 'p3a_t3';
        else if (modLower.includes('dem') || modLower.includes('part') || modLower.includes('elections')) matchedTopicId = 'p3a_t5';
        else if (modLower.includes('scotus') || modLower.includes('supreme') || modLower.includes('rights')) matchedTopicId = 'p3a_t4';
        else if (modLower.includes('constitution') || modLower.includes('federalism')) matchedTopicId = 'p3a_t1';

        // Paper 1 (UK Politics & Core Ideologies) Mapping
        else if (paperLower.includes('uk politics')) {
          if (modLower.includes('democracy') || modLower.includes('participation')) matchedTopicId = 'p1_m1_t1';
          else if (modLower.includes('parties') || modLower.includes('party')) matchedTopicId = 'p1_m1_t2';
          else if (modLower.includes('electoral') || modLower.includes('voting system')) matchedTopicId = 'p1_m1_t3';
          else if (modLower.includes('media') || modLower.includes('voting behaviour')) matchedTopicId = 'p1_m1_t4';
        }
        else if (paperLower.includes('core ideologies')) {
          if (modLower.includes('conservatism') || prompt.toLowerCase().includes('conservatism')) matchedTopicId = 'p1_m2_t1';
          else if (modLower.includes('liberalism') || prompt.toLowerCase().includes('liberalism')) matchedTopicId = 'p1_m2_t2';
          else if (modLower.includes('socialism') || prompt.toLowerCase().includes('socialism')) matchedTopicId = 'p1_m2_t3';
        }

        // Paper 2 (UK Government & Non-Core Ideologies) Mapping
        else if (paperLower.includes('uk government')) {
          if (modLower.includes('constitution') || modLower.includes('devolution')) matchedTopicId = 'p2_m1_t1';
          else if (modLower.includes('parliament') || modLower.includes('commons') || modLower.includes('lords')) matchedTopicId = 'p2_m1_t2';
          else if (modLower.includes('executive') || modLower.includes('prime minister') || modLower.includes('cabinet')) matchedTopicId = 'p2_m1_t3';
          else if (modLower.includes('judiciary') || modLower.includes('branches') || modLower.includes('supreme court')) matchedTopicId = 'p2_m1_t4';
        }
        else if (paperLower.includes('feminism') || modLower.includes('feminism')) matchedTopicId = 'p2_m2_fem';
        else if (paperLower.includes('anarchism') || modLower.includes('anarchism')) matchedTopicId = 'p2_m2_ana';
        else if (paperLower.includes('ecologism') || modLower.includes('ecologism')) matchedTopicId = 'p2_m2_eco';
        else if (paperLower.includes('multiculturalism') || modLower.includes('multiculturalism')) matchedTopicId = 'p2_m2_mul';
        else if (paperLower.includes('nationalism') || modLower.includes('nationalism')) matchedTopicId = 'p2_m2_nat';

        if (matchedTopicId) {
          SPEC_DATA.papers.forEach(p => {
            p.modules.forEach(m => {
              m.topics.forEach(t => {
                if (t.id === matchedTopicId) {
                  if (!t.questions) t.questions = [];
                  const exists = t.questions.some(q => q.prompt === prompt);
                  if (!exists) {
                    t.questions.push({ year, type, prompt });
                    addedCount++;
                  }
                }
              });
            });
          });
        }
      }

      saveState();
      render();
      return addedCount;
    }

    // --- 4. UI RENDERING & PROGRESS ---
    function render() {
      const container = document.getElementById("appContainer");
      container.innerHTML = "";

      SPEC_DATA.papers.forEach(paper => {
        if (paper.optionRoute && paper.optionRoute !== appState.p3Route) return;

        const paperEl = document.createElement("div");
        paperEl.className = "paper-card";

        let modulesHtml = "";
        paper.modules.forEach(mod => {
          let topicsHtml = "";
          mod.topics.forEach(t => {
            if (t.optionKey && t.optionKey !== appState.nonCore) return;

            const currentStatus = appState.statuses[t.id] || 0;
            
            let bulletsHtml = t.bullets && t.bullets.length ? `<div class="section-subtitle">Specification Content</div><ul class="spec-list">` +
              t.bullets.map(b => `<li>${b}</li>`).join("") + `</ul>` : "";

            let thinkersHtml = t.thinkers && t.thinkers.length ? `<div class="section-subtitle">Key Thinkers</div>` + 
              t.thinkers.map(tk => `<span class="thinker-tag">${tk}</span>`).join("") : "";

            let questionsHtml = "";
            if (t.questions && t.questions.length) {
              questionsHtml = `<div class="section-subtitle">Past Exam Questions (${t.questions.length})</div>` +
                t.questions.map((q, idx) => {
                  const qKey = `${t.id}_q${idx}`;
                  const qStat = appState.questionStatuses[qKey] || "unattempted";
                  return `
                    <div class="question-item">
                      <div class="question-meta">
                        <span><strong>${q.year}</strong> • ${q.type}</span>
                        <select onchange="updateQuestionStatus('${qKey}', this.value)" style="font-size:0.75rem; padding:2px;">
                          <option value="unattempted" ${qStat==='unattempted'?'selected':''}>Not Started</option>
                          <option value="planned" ${qStat==='planned'?'selected':''}>Essay Planned</option>
                          <option value="completed" ${qStat==='completed'?'selected':''}>Essay Written</option>
                        </select>
                      </div>
                      <div>"${q.prompt}"</div>
                    </div>`;
                }).join("");
            }

            topicsHtml += `
              <div class="topic-card">
                <div class="topic-header">
                  <span class="topic-name">${t.name}</span>
                  <select class="status-select status-${currentStatus}" onchange="updateTopicStatus('${t.id}', this.value)">
                    <option value="0" class="status-0" ${currentStatus==0?'selected':''}>🔴 Not Started</option>
                    <option value="1" class="status-1" ${currentStatus==1?'selected':''}>🟠 Notes Done</option>
                    <option value="2" class="status-2" ${currentStatus==2?'selected':''}>🟡 Terms/Thinkers Memorised</option>
                    <option value="3" class="status-3" ${currentStatus==3?'selected':''}>🟢 Exam Ready</option>
                  </select>
                </div>
                ${(bulletsHtml || thinkersHtml || questionsHtml) ? `
                  <button class="drawer-toggle" onclick="toggleDrawer('${t.id}_drawer')">Spec & Questions (${(t.questions || []).length}) ▼</button>
                  <div id="${t.id}_drawer" class="drawer-content">
                    ${bulletsHtml}
                    ${thinkersHtml}
                    ${questionsHtml}
                  </div>
                ` : ''}
              </div>`;
          });

          if (topicsHtml) {
            modulesHtml += `<div style="margin-top:14px;"><strong style="color:var(--text-muted); font-size:0.9rem;">${mod.title}</strong>${topicsHtml}</div>`;
          }
        });

        paperEl.innerHTML = `<div class="paper-title"><span>${paper.title}</span></div>${modulesHtml}`;
        container.appendChild(paperEl);
      });

      updateProgress();
    }

    function toggleDrawer(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle("open");
    }

    function updateTopicStatus(id, val) {
      appState.statuses[id] = parseInt(val, 10);
      saveState();
      render();
    }

    function updateQuestionStatus(qKey, val) {
      appState.questionStatuses[qKey] = val;
      saveState();
    }

    function updateProgress() {
      let total = 0;
      let score = 0;

      SPEC_DATA.papers.forEach(p => {
        if (p.optionRoute && p.optionRoute !== appState.p3Route) return;
        p.modules.forEach(m => {
          m.topics.forEach(t => {
            if (t.optionKey && t.optionKey !== appState.nonCore) return;
            total += 3;
            score += (appState.statuses[t.id] || 0);
          });
        });
      });

      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      document.getElementById("overallPercentage").innerText = `${pct}%`;
      document.getElementById("overallBar").style.width = `${pct}%`;
    }

    // --- 5. EVENT LISTENERS & HANDLERS ---
    document.getElementById("p3RouteSelect").addEventListener("change", (e) => {
      appState.p3Route = e.target.value;
      saveState();
      render();
    });

    document.getElementById("nonCoreSelect").addEventListener("change", (e) => {
      appState.nonCore = e.target.value;
      saveState();
      render();
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      appState.theme = appState.theme === "light" ? "dark" : "light";
      saveState();
      document.body.classList.toggle("light-mode", appState.theme === "light");
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `politics_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchor.click();
    });

    document.getElementById("importBtn").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });

    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          appState = JSON.parse(evt.target.result);
          saveState();
          loadState();
          render();
          alert("Progress successfully imported!");
        } catch (err) {
          alert("Invalid JSON file format.");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("templateCsvBtn")?.addEventListener("click", () => {
      const csvHeaders = ["Year", "Paper", "Type", "Question", "Main Module"];
      const exampleRows = [
        ["2026", "US Politics", "Essay", "Evaluate the view that increasing partisanship has made political parties more effective in Congress.", "Congress"],
        ["2026", "US Politics", "Essay", "Evaluate the view that the US presidency is imperial.", "POTUS"],
        ["2026", "Feminism", "Essay", "To what extent is feminism divided in its views on society?", "Feminism"],
        ["2026", "UK Politics", "Essay", "Evaluate the view, using examples, that greater use of direct democracy in the UK would strengthen representative democracy.", "Democracy"],
        ["2025", "UK Government", "Essay", "Evaluate the view that Prime Ministers now have too much power.", "Executive"]
      ];

      const formatCell = (val) => `"${String(val).replace(/"/g, '""')}"`;
      const csvContent = [
        csvHeaders.map(formatCell).join(","),
        ...exampleRows.map(row => row.map(formatCell).join(","))
      ].join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const dlAnchor = document.createElement("a");
      dlAnchor.setAttribute("href", url);
      dlAnchor.setAttribute("download", "past_questions_template.csv");
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      document.body.removeChild(dlAnchor);
      URL.revokeObjectURL(url);
    });

    document.getElementById("importCsvBtn")?.addEventListener("click", () => {
      document.getElementById("csvFileInput")?.click();
    });

    document.getElementById("csvFileInput")?.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const count = importQuestionsFromCSV(evt.target.result);
        alert(`Successfully imported ${count} new past paper questions!`);
      };
      reader.readAsText(file);
    });

    // --- 6. SERVICE WORKER REGISTRATION ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
      });
    }

    // --- INITIALIZE APP ---
    loadState();
    render();
  </script>
</body>
</html>
