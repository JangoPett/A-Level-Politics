<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>A-Level Politics Topic & Question Tracker (Edexcel 9PL0) - v2.0</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --status-0: #ef4444;
      --status-1: #f59e0b;
      --status-2: #eab308;
      --status-3: #10b981;
    }
    body.light-mode {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1050px; margin: 0 auto; transition: background 0.3s, color 0.3s; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.875rem; transition: background 0.2s; }
    button:hover, select:hover { border-color: var(--accent); }
    
    .overall-progress { background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-bottom: 24px; }
    .progress-bar-bg { background: var(--border); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.4s ease; }
    
    .paper-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .paper-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    
    .module-block { margin-top: 20px; }
    .module-header {
      background: var(--border);
      color: var(--accent);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--accent);
    }
    
    .subsection-card { border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-top: 10px; background: rgba(0,0,0,0.05); }
    .subsection-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .subsection-name { font-weight: 600; flex-grow: 1; }
    
    .status-badge { font-weight: 700; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; text-transform: uppercase; border: 1px solid currentColor; }
    .status-select { font-weight: 600; padding: 4px 8px; font-size: 0.8rem; }
    .status-0 { color: var(--status-0); }
    .status-1 { color: var(--status-1); }
    .status-2 { color: var(--status-2); }
    .status-3 { color: var(--status-3); }

    .bullet-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px dotted var(--border); gap: 12px; font-size: 0.875rem; }
    .bullet-symbol { font-size: 1.1rem; color: var(--accent); line-height: 1.2; padding-right: 4px; }
    .bullet-text { flex-grow: 1; color: var(--text); line-height: 1.4; display: flex; gap: 8px; }
    
    .drawer-toggle { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; text-decoration: underline; padding: 4px 0; margin-top: 6px; display: inline-block; }
    .drawer-content { display: none; margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
    .drawer-content.open { display: block; }
    
    .section-subtitle { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; margin-top: 10px; }
    .thinker-tag { display: inline-block; background: var(--border); padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; margin: 2px 4px 2px 0; }
    
    .question-item { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin-top: 6px; font-size: 0.875rem; }
    .question-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    
    footer { text-align: center; margin-top: 32px; padding: 16px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.875rem; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>A-Level Politics Tracker</h1>
      <span style="font-size: 0.8rem; color: var(--text-muted);">Pearson Edexcel (9PL0) Granular Specification Tracker</span>
    </div>
    <div class="controls">
      <button id="themeToggle">🌓 Theme</button>
      <button id="exportBtn">📥 Export JSON</button>
      <button id="importBtn">📤 Import JSON</button>
      <input type="file" id="importFile" class="hidden" accept=".json">
    </div>
  </header>

  <div class="overall-progress">
    <div style="display: flex; justify-content: space-between; font-weight: 600;">
      <span>Overall Course Readiness (UK Politics, Feminism & US Politics)</span>
      <span id="overallPercentage">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div id="overallBar" class="progress-bar-fill"></div>
    </div>
  </div>

  <main id="appContainer"></main>

  <footer>
    <p>A-Level Politics Specification Tracker — <strong>Version 2.0</strong></p>
  </footer>

  <!-- 1. Load Data Modules First -->
  <script src="js/paper1-uk.js"></script>
  <script src="js/paper1-core.js"></script>
  <script src="js/paper2-uk.js"></script>
  <script src="js/paper2-feminism.js"></script>
  <script src="js/paper3-us.js"></script>

  <!-- 2. Load Main Application Engine Last -->
  <script src="js/app.js"></script>
</body>
</html>
