    :root {
      --bg: #0f172a;

      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --status-0: #ef4444;
      --status-1: #f59e0b;
      --status-2: #eab308;
      --status-3: #10b981;
    }
    body.light-mode {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1050px; margin: 0 auto; transition: background 0.3s, color 0.3s; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.875rem; transition: background 0.2s; }
    button:hover, select:hover { border-color: var(--accent); }
    
    .overall-progress { background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-bottom: 24px; }
    .progress-bar-bg { background: var(--border); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.4s ease; }
    
    .paper-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .paper-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    .module-block { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 12px; }
    .module-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    .subsection-card { border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-top: 10px; background: rgba(0,0,0,0.05); }
    .subsection-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .subsection-name { font-weight: 600; flex-grow: 1; }
    
    .status-badge { font-weight: 700; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; text-transform: uppercase; border: 1px solid currentColor; }
    .status-select { font-weight: 600; padding: 4px 8px; font-size: 0.8rem; }
    .status-0 { color: var(--status-0); }
    .status-1 { color: var(--status-1); }
    .status-2 { color: var(--status-2); }
    .status-3 { color: var(--status-3); }

    .bullet-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px dotted var(--border); gap: 12px; font-size: 0.875rem; }
    .bullet-symbol { font-size: 1.1rem; color: var(--accent); line-height: 1.2; padding-right: 4px; }
    .bullet-text { flex-grow: 1; color: var(--text); line-height: 1.4; display: flex; gap: 8px; }
    
    .drawer-toggle { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 0.8rem; text-decoration: underline; padding: 4px 0; margin-top: 6px; display: inline-block; }
    .drawer-content { display: none; margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
    .drawer-content.open { display: block; }
    
    .section-subtitle { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; margin-top: 10px; }
    .thinker-tag { display: inline-block; background: var(--border); padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; margin: 2px 4px 2px 0; }
    
    .question-item { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin-top: 6px; font-size: 0.875rem; }
    .question-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    
    .hidden { display: none !important; }
  </style>
</head>

      if (saved) {
        appState = { ...appState, ...JSON.parse(saved) };
      }
      document.body.classList.toggle("light-mode", appState.theme === "light");

    function getSubsectionStatus(sub) {
      if (!sub.bullets || sub.bullets.length === 0) return 0;
      const scores = sub.bullets.map(b => appState.bulletStatuses[b.id] || 0);
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      return Math.round(avg);
    }

    function getModuleStatus(mod) {
      const activeSubs = mod.subsections.filter(s => !s.optionKey || s.optionKey === appState.nonCore);
      if (activeSubs.length === 0) return 0;
      const scores = activeSubs.map(s => getSubsectionStatus(s));
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      return Math.round(avg);
    }

    function getPaperStatus(paper) {
      if (!paper.modules || paper.modules.length === 0) return 0;
      const scores = paper.modules.map(m => getModuleStatus(m));
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      return Math.round(avg);
    }

    function getStatusBadgeHtml(statusNum) {
      const labels = [
        "🔴 Not Started",
        "🟠 Some Notes Done",
        "🟡 Most Terms & Thinkers Memorised",
        "🟢 Exam Ready"
      ];
      return `<span class="status-badge status-${statusNum}">${labels[statusNum]}</span>`;
    }

    // --- 3. DOM RENDERING ---
    function render() {
      const container = document.getElementById("appContainer");
      container.innerHTML = "";

      SPEC_DATA.papers.forEach(paper => {
        if (paper.optionRoute && paper.optionRoute !== appState.p3Route) return;

        const paperEl = document.createElement("div");
        paperEl.className = "paper-card";
        paperEl.id = `paper_${paper.paperId}`;

        const paperStat = getPaperStatus(paper);
        let paperHtml = `<div class="paper-title">
          <span>${paper.title}</span>
          <span id="badge_${paper.paperId}">${getStatusBadgeHtml(paperStat)}</span>
        </div>`;

        paper.modules.forEach(mod => {
          const modStat = getModuleStatus(mod);
          let subHtml = "";

          mod.subsections.forEach(sub => {
            if (sub.optionKey && sub.optionKey !== appState.nonCore) return;

            const subStat = getSubsectionStatus(sub);

            let bulletsHtml = `<div class="section-subtitle">Specification Bullet Points</div>`;
            sub.bullets.forEach(b => {
              const bStat = appState.bulletStatuses[b.id] || 0;
              bulletsHtml += `
                <div class="bullet-item">
                  <span class="bullet-text"><span class="bullet-symbol">•</span><span>${b.text}</span></span>
                  <select class="status-select status-${bStat}" id="select_${b.id}" onchange="updateBulletStatus('${b.id}', '${sub.id}', '${mod.id}', '${paper.paperId}', this.value)">
                    <option value="0" class="status-0" ${bStat==0?'selected':''}>🔴 Not Started</option>
                    <option value="1" class="status-1" ${bStat==1?'selected':''}>🟠 Some Notes Done</option>
                    <option value="2" class="status-2" ${bStat==2?'selected':''}>🟡 Most Terms & Thinkers Memorised</option>
                    <option value="3" class="status-3" ${bStat==3?'selected':''}>🟢 Exam Ready</option>
                  </select>
                </div>`;
            });

            let thinkersHtml = sub.thinkers && sub.thinkers.length ? `<div class="section-subtitle">Key Thinkers</div>` + 
              sub.thinkers.map(tk => `<span class="thinker-tag">${tk}</span>`).join("") : "";

            let questionsHtml = "";
            if (sub.questions && sub.questions.length) {
              questionsHtml = `<div class="section-subtitle">Past Exam Questions (${sub.questions.length})</div>` +
                sub.questions.map((q, idx) => {
                  const qKey = `${sub.id}_q${idx}`;
                  const qStat = appState.questionStatuses[qKey] || "unattempted";
                  return `
                    <div class="question-item">
                      <div class="question-meta">
                        <span><strong>${q.year}</strong> • ${q.type}</span>
                        <select onchange="updateQuestionStatus('${qKey}', this.value)" style="font-size:0.75rem; padding:2px;">
                          <option value="unattempted" ${qStat==='unattempted'?'selected':''}>Not Started</option>
                          <option value="planned" ${qStat==='planned'?'selected':''}>Essay Planned</option>
                          <option value="completed" ${qStat==='completed'?'selected':''}>Essay Written</option>
                        </select>
                      </div>
                      <div>"${q.prompt}"</div>
                    </div>`;
                }).join("");
            }

            subHtml += `
              <div class="subsection-card">
                <div class="subsection-header">
                  <span class="subsection-name">${sub.name}</span>
                  <span id="badge_sub_${sub.id}">${getStatusBadgeHtml(subStat)}</span>
                </div>
                <button class="drawer-toggle" onclick="toggleDrawer('${sub.id}_drawer')">Granular Spec & Questions (${(sub.questions || []).length}) ▼</button>
                <div id="${sub.id}_drawer" class="drawer-content">
                  ${bulletsHtml}
                  ${thinkersHtml}
                  ${questionsHtml}
                </div>
              </div>`;
          });

          paperHtml += `
            <div class="module-block">
              <div class="module-title">
                <span>${mod.title}</span>
                <span id="badge_mod_${mod.id}">${getStatusBadgeHtml(modStat)}</span>
              </div>
              ${subHtml}
            </div>`;
        });

        paperEl.innerHTML = paperHtml;
        container.appendChild(paperEl);
      });

      updateProgress();
    }

    function toggleDrawer(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle("open");
    }

    function updateBulletStatus(bulletId, subId, modId, paperId, val) {
      appState.bulletStatuses[bulletId] = parseInt(val, 10);
      saveState();

      const sel = document.getElementById(`select_${bulletId}`);
      if (sel) {
        sel.className = `status-select status-${val}`;
      }

      let targetSub = null, targetMod = null, targetPaper = null;

      SPEC_DATA.papers.forEach(p => {
        if (p.paperId === paperId) {
          targetPaper = p;
          p.modules.forEach(m => {
            if (m.id === modId) {
              targetMod = m;
              m.subsections.forEach(s => {
                if (s.id === subId) targetSub = s;
              });
            }
          });
        }
      });

      if (targetSub) {
        const newSubStat = getSubsectionStatus(targetSub);
        const subBadge = document.getElementById(`badge_sub_${subId}`);
        if (subBadge) subBadge.innerHTML = getStatusBadgeHtml(newSubStat);
      }

      if (targetMod) {
        const newModStat = getModuleStatus(targetMod);
        const modBadge = document.getElementById(`badge_mod_${modId}`);
        if (modBadge) modBadge.innerHTML = getStatusBadgeHtml(newModStat);
      }

      if (targetPaper) {
        const newPaperStat = getPaperStatus(targetPaper);
        const paperBadge = document.getElementById(`badge_${paperId}`);
        if (paperBadge) paperBadge.innerHTML = getStatusBadgeHtml(newPaperStat);
      }
    }

    function updateQuestionStatus(qKey, val) {
      appState.questionStatuses[qKey] = val;
      saveState();
    }

    function updateProgress() {
      let totalBullets = 0;
      let score = 0;

      SPEC_DATA.papers.forEach(p => {
        if (p.optionRoute && p.optionRoute !== appState.p3Route) return;
        p.modules.forEach(m => {
          m.subsections.forEach(s => {
            if (s.optionKey && s.optionKey !== appState.nonCore) return;
            s.bullets.forEach(b => {
              totalBullets += 3;
              score += (appState.bulletStatuses[b.id] || 0);
            });
          });
        });
      });

      const pct = totalBullets > 0 ? Math.round((score / totalBullets) * 100) : 0;
      document.getElementById("overallPercentage").innerText = `${pct}%`;
      document.getElementById("overallBar").style.width = `${pct}%`;
    }

    // --- 4. EVENT LISTENERS ---
    document.getElementById("p3RouteSelect").addEventListener("change", (e) => {
      appState.p3Route = e.target.value;
      saveState();
      render();
    });

    document.getElementById("nonCoreSelect").addEventListener("change", (e) => {
      appState.nonCore = e.target.value;
      saveState();
      render();
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      appState.theme = appState.theme === "light" ? "dark" : "light";
      saveState();
      document.body.classList.toggle("light-mode", appState.theme === "light");
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `politics_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchor.click();
    });

    document.getElementById("importBtn").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });

    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          appState = JSON.parse(evt.target.result);
          saveState();
          loadState();
          render();
          alert("Progress successfully imported!");
        } catch (err) {
          alert("Invalid JSON file format.");
        }
      };
      reader.readAsText(file);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
      });
    }

    loadState();
    render();
  </script>
</body>
</html>
